name: Build plugin

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build with Maven
        working-directory: ShadowClones
        run: mvn -B package
      - name: Save the jar
        uses: actions/upload-artifact@v4
        with:
          name: ShadowClones
          path: ShadowClones/target/ShadowClones.jar
